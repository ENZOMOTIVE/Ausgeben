<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Animated Ausgeben expense tracker preview</title>
  <desc id="description">Carlin's total updates while Aayushman's itemized view keeps Carlin's purchase details private.</desc>
  <style>
    .copy { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-variant-numeric: tabular-nums; }
    .new-row { animation: row-in 5.5s ease-in-out infinite; transform-origin: center; }
    .old-total { animation: total-out 5.5s ease-in-out infinite; }
    .new-total { animation: total-in 5.5s ease-in-out infinite; }
    .tap { animation: tap 5.5s ease-in-out infinite; transform-origin: 1037px 515px; }
    .pulse { animation: pulse 5.5s ease-in-out infinite; transform-origin: center; }
    @keyframes row-in {
      0%, 24% { opacity: 0; transform: translateY(18px); }
      36%, 84% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes total-out {
      0%, 26% { opacity: 1; transform: translateY(0); }
      34%, 94% { opacity: 0; transform: translateY(-9px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes total-in {
      0%, 27% { opacity: 0; transform: translateY(10px); }
      36%, 91% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes tap {
      0%, 11%, 100% { transform: scale(1); }
      15% { transform: scale(.94); }
      20% { transform: scale(1); }
    }
    @keyframes pulse {
      0%, 22%, 100% { opacity: .18; transform: scale(.82); }
      30%, 42% { opacity: .5; transform: scale(1.12); }
      52%, 94% { opacity: .18; transform: scale(.82); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .old-total { opacity: 0; }
      .new-total, .new-row { opacity: 1; }
    }
  </style>
  <rect width="1200" height="630" rx="34" fill="#f2efe7"/>
  <circle cx="107" cy="102" r="31" fill="#0d3f37"/>
  <text class="copy" x="107" y="112" text-anchor="middle" font-size="24" font-weight="800" fill="#dfff81">a.</text>
  <text class="copy" x="155" y="98" font-size="27" font-weight="720" fill="#16332e">Ausgeben</text>
  <text class="copy" x="155" y="122" font-size="14" font-weight="520" fill="#62736f">Shared expenses</text>
  <text class="copy" x="88" y="240" font-size="18" font-weight="750" letter-spacing="2.2" fill="#62736f">GERMANY · SHARED LEDGER</text>
  <text class="copy" x="88" y="302" font-size="52" font-weight="680" letter-spacing="-2.6" fill="#16332e">Our spending,</text>
  <text class="copy" x="88" y="356" font-size="52" font-weight="680" letter-spacing="-2.6" fill="#16332e">made clear.</text>
  <text class="copy" x="88" y="420" font-size="18" font-weight="470" fill="#62736f">Log it in seconds. See it on every device.</text>
  <rect x="88" y="473" width="188" height="54" rx="27" fill="#0d3f37"/>
  <text class="copy" x="182" y="507" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Add expense  →</text>
  <g transform="translate(625 56)">
    <rect width="487" height="518" rx="35" fill="#fffdf8" stroke="#d9d6cd"/>
    <rect x="25" y="25" width="437" height="263" rx="27" fill="#0d3f37"/>
    <circle cx="415" cy="230" r="103" fill="none" stroke="#dfff81" stroke-width="38" opacity=".12"/>
    <text class="copy" x="53" y="64" font-size="13" font-weight="620" fill="#ffffff" opacity=".62">THIS MONTH</text>
    <text class="copy" x="53" y="104" font-size="15" font-weight="700" fill="#dfff81">Juli 2026</text>
    <text class="copy" x="53" y="137" font-size="10" font-weight="650" fill="#ffffff" opacity=".58">AAYUSHMAN</text>
    <text class="copy mono" x="53" y="175" font-size="34" font-weight="660" letter-spacing="-1.6" fill="#ffffff">42,10 €</text>
    <text class="copy" x="252" y="137" font-size="10" font-weight="650" fill="#ffffff" opacity=".58">CARLIN</text>
    <g class="old-total">
      <text class="copy mono" x="252" y="175" font-size="34" font-weight="660" letter-spacing="-1.6" fill="#ffffff">44,20 €</text>
    </g>
    <g class="new-total" opacity="0">
      <text class="copy mono" x="252" y="175" font-size="34" font-weight="660" letter-spacing="-1.6" fill="#ffffff">69,00 €</text>
    </g>
    <text class="copy" x="53" y="207" font-size="13" font-weight="500" fill="#ffffff" opacity=".56">Separate totals · private details</text>
    <rect x="46" y="226" width="395" height="43" rx="13" fill="#ffffff" opacity=".07"/>
    <text class="copy" x="63" y="252" font-size="11" fill="#ffffff" opacity=".7">NO COMBINED TOTAL · NO PARTNER DETAILS</text>
    <text class="copy" x="30" y="331" font-size="12" font-weight="750" letter-spacing="1.4" fill="#62736f">TODAY</text>
    <rect x="25" y="350" width="437" height="70" rx="18" fill="#f8f5ed" stroke="#e7e2d8"/>
    <rect x="41" y="364" width="42" height="42" rx="13" fill="#e5eed8"/>
    <text class="copy" x="62" y="391" text-anchor="middle" font-size="15" font-weight="780" fill="#0d3f37">A</text>
    <text class="copy" x="99" y="382" font-size="15" font-weight="670" fill="#16332e">Morning coffee</text>
    <text class="copy" x="99" y="400" font-size="11" fill="#62736f">Your entry · tap to edit</text>
    <text class="copy mono" x="441" y="389" text-anchor="end" font-size="15" font-weight="730" fill="#16332e">4,20 €</text>
    <g class="new-row" opacity="0">
      <rect x="25" y="432" width="437" height="70" rx="18" fill="#f8f5ed" stroke="#d9e5cd"/>
      <rect x="41" y="446" width="42" height="42" rx="13" fill="#ffe5dc"/>
      <path d="M54 467a8 8 0 0 1 16 0v4H54z" fill="none" stroke="#873c29" stroke-width="2"/>
      <rect x="52" y="469" width="20" height="15" rx="4" fill="#873c29"/>
      <text class="copy" x="99" y="464" font-size="15" font-weight="670" fill="#16332e">Carlin's total updated</text>
      <text class="copy" x="99" y="482" font-size="11" fill="#62736f">Purchase details stay private</text>
      <text class="copy mono" x="441" y="471" text-anchor="end" font-size="15" font-weight="730" fill="#16332e">+24,80 €</text>
    </g>
  </g>
  <circle class="pulse" cx="1037" cy="515" r="34" fill="#dfff81" opacity=".18"/>
  <g class="tap">
    <circle cx="1037" cy="515" r="24" fill="#0d3f37"/>
    <path d="M1037 504v22M1026 515h22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
